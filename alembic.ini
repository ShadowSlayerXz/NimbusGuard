# NimbusGuard Alembic configuration
# Use backend/alembic.ini inside Docker containers.
# This root-level copy is for local development convenience.

[alembic]
script_location = backend/db/migrations
# sqlalchemy.url is overridden at runtime in env.py from DATABASE_URL env var
sqlalchemy.url = postgresql+asyncpg://nimbusguard:nimbusguard@localhost:5432/nimbusguard

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
